name: BR QA Dispatcher

on:
  schedule:
    # Every 5 minutes, weekdays, 07:00–23:00 BST (06:00–22:00 UTC).
    - cron: '*/5 6-22 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: qa-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dispatch new deals
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 dispatch_deals.py
