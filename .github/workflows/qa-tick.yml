name: BR QA Checker

on:
  schedule:
    # Every 5 minutes, weekdays, 07:00–23:00 BST (06:00–22:00 UTC).
    # NB: when UK clocks go back in late October, adjust to 07:00–23:00 UTC.
    - cron: '*/5 6-22 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: qa-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache global npm (Claude CLI)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-claude-code-v1

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Playwright (pip only)
        # We deliberately do NOT run `playwright install chromium` — that's a
        # ~300MB download every cold run (Chrome 184MB + Headless Shell 115MB
        # + FFmpeg 2MB) that eats the whole job budget and prevents the
        # actions/cache post step from ever populating a warm cache, so the
        # tick never actually runs. GH Actions runners ship with Google
        # Chrome pre-installed, and refresh_cookies.py launches with
        # channel="chrome" first, falling back to the bundled Chromium only
        # if that fails. On this runner it doesn't fail — so pip alone is
        # enough.
        run: pip install playwright

      - name: Restore BR cookies cache
        id: cookies-cache
        uses: actions/cache@v4
        with:
          path: cookies.json
          key: br-cookies-${{ github.run_id }}
          restore-keys: |
            br-cookies-

      - name: Refresh BR cookies if missing/stale
        env:
          BR_USERNAME: ${{ secrets.BR_USERNAME }}
          BR_PASSWORD: ${{ secrets.BR_PASSWORD }}
          BR_NGINX_USER: ${{ secrets.BR_NGINX_USER }}
          BR_NGINX_PASS: ${{ secrets.BR_NGINX_PASS }}
        run: |
          # Refresh if no cookies file OR cookies older than 6 hours.
          # BR JSESSIONID is session-scoped; better to over-refresh than serve a 401 mid-tick.
          if [ ! -f cookies.json ]; then
            echo "No cookies.json — logging in fresh."
            python3 refresh_cookies.py || { echo "cookie refresh failed"; cat _login_page_debug.html 2>/dev/null | head -c 2000 || true; exit 1; }
          else
            AGE=$(( $(date +%s) - $(stat -c %Y cookies.json) ))
            if [ $AGE -gt 21600 ]; then
              echo "cookies.json is ${AGE}s old (>6h) — refreshing."
              python3 refresh_cookies.py || { echo "cookie refresh failed"; exit 1; }
            else
              echo "cookies.json is ${AGE}s old — reusing."
            fi
          fi

      - name: Prepare shards
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          mkdir -p logs
          # 4 shards × up to 10 msgs = up to 40/tick, all pre-fetched once
          # and split by prepare_batches.py so parallel sessions never
          # collide on messages or state.
          python3 prepare_batches.py 4 40 | tee -a logs/tick.log

      - name: Run 4 parallel shards
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          BR_USERNAME: ${{ secrets.BR_USERNAME }}
          BR_PASSWORD: ${{ secrets.BR_PASSWORD }}
        run: |
          echo "=== tick $(date -u +%Y-%m-%dT%H:%M:%SZ) ===" | tee -a logs/tick.log

          TOTAL=$(python3 -c "import json; print(json.load(open('queue_meta.json'))['total'])")
          if [ "$TOTAL" = "0" ]; then
            echo "no new messages in window — skipping" | tee -a logs/tick.log
            exit 0
          fi

          # Spawn one Claude session per shard. Each session reads its
          # $SHARD_FILE and writes to $STATE_DELTA_FILE. `wait` blocks
          # until all four finish; `set -m` gives them proper job control.
          set -m
          for i in 0 1 2 3; do
            (
              export SHARD_FILE="shard_$i.json"
              export STATE_DELTA_FILE="state_delta_$i.json"
              echo "--- shard $i start $(date -u +%H:%M:%SZ) ---" >> logs/shard_$i.log
              claude -p "$(cat tick_shard_prompt.txt)" \
                --model claude-sonnet-5 \
                --dangerously-skip-permissions \
                >> logs/shard_$i.log 2>&1
              echo "--- shard $i done  $(date -u +%H:%M:%SZ) ---" >> logs/shard_$i.log
            ) &
          done
          wait
          echo "=== all shards complete $(date -u +%Y-%m-%dT%H:%M:%SZ) ===" | tee -a logs/tick.log

      - name: Merge state deltas + apply reactions
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          # merge_deltas.py also applies the term-sheet-message emoji
          # reaction based on each new delta's verdict (clean → :double-tick:,
          # flagged → :exclamation:). This is deterministic — the shard
          # prompt has the same instruction but the LLM sometimes skipped
          # it, so we backstop it here.
          if ls state_delta_*.json >/dev/null 2>&1; then
            python3 merge_deltas.py | tee -a logs/tick.log
          else
            echo "no state deltas to merge" | tee -a logs/tick.log
          fi
          # Also tidy up shard artifacts so they don't leak into the commit
          rm -f shard_*.json queue_meta.json

      - name: Save BR cookies cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cookies.json
          key: br-cookies-${{ github.run_id }}

      - name: Commit updated state.json
        if: always()
        run: |
          git config user.name "brqa-bot"
          git config user.email "brqa-bot@users.noreply.github.com"
          if git diff --quiet state.json 2>/dev/null; then
            echo "state.json unchanged"
          else
            git add state.json
            git commit -m "state: tick $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
            git push || true
          fi
